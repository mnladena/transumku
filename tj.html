<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Peta TransJakarta</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Public+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  html, body { height: 100%; }
  #map { position: absolute; inset: 0; background: var(--bg); }
  .sheet {
    position: absolute; z-index: 1000; top: 12px; left: 12px; bottom: 12px; width: 370px; overflow: auto;
    display: flex; flex-direction: column; gap: 12px; padding: 16px;
    background: rgba(12, 18, 34, .86); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 20px 50px rgba(0, 0, 0, .45);
  }
  .sheet .top { flex-wrap: nowrap; }
  .sheet .brand { font-size: 22px; }
  .sheet select.big { font-size: 19px; padding: 10px 40px 10px 12px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
  .stat b { display: block; margin-top: 4px; font: 800 28px/1 var(--display); color: var(--amber); font-variant-numeric: tabular-nums; }
  #near { display: grid; gap: 10px; }
  .kind { display: block; margin-bottom: 2px; }
  .note { font-size: 11px; margin-top: auto; }
  .leaflet-container { font-family: var(--body); }
  /* Night map from standard OSM tiles; keyless dark tile services keep disappearing. */
  .leaflet-tile-pane { filter: invert(1) hue-rotate(200deg) brightness(.8) contrast(.95) saturate(.35); }
  .leaflet-tooltip { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 18px rgba(0, 0, 0, .4); }
  .leaflet-tooltip-top::before, .leaflet-tooltip-bottom::before, .leaflet-tooltip-left::before, .leaflet-tooltip-right::before { display: none; }
  .leaflet-bar a { background: var(--panel); color: var(--ink); border-color: var(--line); }
  .leaflet-control-attribution { background: rgba(10, 15, 29, .7) !important; color: var(--mute); }
  .leaflet-control-attribution a { color: var(--mute); }
  @media (max-width: 700px) {
    .sheet { top: auto; right: 8px; left: 8px; bottom: 8px; width: auto; max-height: 52vh; padding: 14px; }
    .sheet .tabs a { padding: 7px 10px; }
  }
</style>
</head>
<body>
<div id="map"></div>
<aside class="sheet">
  <header class="top">
    <div class="brand">Transum</div>
    <nav class="tabs"><a href="index.html">KRL</a><a class="on" href="tj.html">TransJakarta</a></nav>
  </header>
  <div class="stats">
    <div class="stat"><span class="label">Bus di jalan</span><b id="info">…</b></div>
    <div class="stat"><span class="label">Jam</span><b id="clock">--.--</b></div>
  </div>
  <label><span class="label">Koridor</span><select class="big" id="route"><option value="">Semua koridor</option></select></label>
  <button class="btn" id="locate">Lokasi saya + terdekat</button>
  <div id="near"></div>
  <p class="note mute">Posisi bus = simulasi dari jadwal GTFS (headway), bukan GPS.</p>
</aside>
<script>
const map = L.map('map', {preferCanvas: true, zoomControl: false}).setView([-6.2, 106.83], 12);
L.control.zoom({position: 'topright'}).addTo(map);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom: 19, attribution: '&copy; OpenStreetMap'}).addTo(map);
const lines = L.layerGroup().addTo(map), buses = new Map();
let trips = [];

// Bus position `off` seconds into a trip: straight line between stops.
// ponytail: ignores road shape (shapes.txt), use it if straight lines look wrong on curvy routes.
function at(stops, off) {
  const i = stops.findLastIndex(s => s[2] <= off), a = stops[i], b = stops[i + 1];
  if (!b) return {ll: [a[0], a[1]], next: a[3]};
  const f = (off - a[2]) / (b[2] - a[2]);
  return {ll: [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f], next: b[3]};
}
console.assert(at([[0, 0, 0, 'A'], [2, 4, 100, 'B']], 50).ll.join() === '1,2');

// Every bus on the road now: departures every headway inside each frequency window.
// ponytail: buses that left before midnight vanish at 00:00.
function active(now, day, route) {
  const out = [];
  trips.forEach((t, ti) => {
    if (!t.d[day] || (route && t.r !== route)) return;
    const dur = t.s.at(-1)[2];
    for (const [s, e, h] of t.f) {
      const k0 = Math.max(0, Math.ceil((now - dur - s) / h)), k1 = Math.min(Math.floor((e - s) / h), Math.floor((now - s) / h));
      for (let k = k0; k <= k1; k++) out.push({id: ti + ':' + (s + k * h), t, off: now - s - k * h});
    }
  });
  return out;
}

function tick() {
  const d = new Date(), now = d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds();
  const list = active(now, (d.getDay() + 6) % 7, $route.value), seen = new Set();
  for (const b of list) {
    const p = at(b.t.s, b.off);
    seen.add(b.id);
    let m = buses.get(b.id);
    if (!m) {
      m = L.circleMarker(p.ll, {radius: 5, color: '#0a0f1d', weight: 1.5, fillColor: b.t.c, fillOpacity: 1}).addTo(map);
      buses.set(b.id, m);
    }
    m.setLatLng(p.ll).bindTooltip(`<b>${esc(b.t.r)}</b> ${esc(b.t.h)}<br><span class="mute">berikut:</span> ${esc(p.next)}`);
  }
  for (const [id, m] of buses) if (!seen.has(id)) { m.remove(); buses.delete(id); }
  $info.textContent = list.length.toLocaleString('id-ID');
  $clock.textContent = d.toLocaleTimeString('id-ID', {hour: '2-digit', minute: '2-digit'});
}

function drawLines() {
  lines.clearLayers();
  trips.filter(t => !$route.value || t.r === $route.value).forEach(t =>
    L.polyline(t.s.map(s => [s[0], s[1]]), {color: t.c, weight: $route.value ? 4 : 1.5, opacity: $route.value ? .8 : .35}).addTo(lines));
  if ($route.value) map.fitBounds(lines.getLayers().map(l => l.getBounds()).reduce((a, b) => a.extend(b)));
}

// Seconds until the next bus of trip `t` reaches the stop `off` seconds into the trip.
function eta(t, off, now) {
  let best = Infinity;
  for (const [s, e, h] of t.f) {
    const dep = s + Math.max(0, Math.ceil((now - off - s) / h)) * h;
    if (dep <= e) best = Math.min(best, dep + off - now);
  }
  return best;
}
console.assert(eta({f: [[0, 1000, 100]]}, 30, 250) === 80 && eta({f: [[0, 1000, 100]]}, 30, 2000) === Infinity);

const esc = s => String(s).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const fmtDist = d => d < 1000 ? Math.round(d) + ' m' : (d / 1000).toFixed(1) + ' km';
// Dark or light badge text, whichever reads on the route colour.
const ink = c => parseInt(c.slice(1, 3), 16) * .299 + parseInt(c.slice(3, 5), 16) * .587 + parseInt(c.slice(5, 7), 16) * .114 > 150 ? '#0a0f1d' : '#fff';
const card = (kind, name, d, rows) => `<section class="card"><span class="label kind">${kind}</span><h4><span>${name}</span><small>${fmtDist(d)}</small></h4>${rows}</section>`;
const halte = new Map(), krlSchedule = {}, nearLayer = L.layerGroup().addTo(map);
let krl = {}, me = null, meMarker = null;

async function near() {
  if (!me) return;
  const d = new Date(), now = d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds(), day = (d.getDay() + 6) % 7;
  const closest = (list, n) => list.map(x => ({...x, d: map.distance(me, x.ll)})).sort((a, b) => a.d - b.d).slice(0, n);
  const stops = closest([...halte.values()], 3);
  const stations = closest(Object.entries(krl).map(([id, [lat, lon, name]]) => ({id, name, ll: [lat, lon]})), 2);

  nearLayer.clearLayers();
  [...stops, ...stations].forEach(x => L.circleMarker(x.ll, {radius: 9, color: x.id ? '#ff5a5f' : '#4da3ff', weight: 3, fill: false})
    .bindTooltip(esc(x.name)).addTo(nearLayer));

  const halteHtml = stops.map(x => {
    const next = new Map();
    for (const [t, off] of x.serve) {
      if (!t.d[day]) continue;
      const key = `${t.r} → ${t.h}`, s = eta(t, off, now);
      if (s < (next.get(key)?.s ?? Infinity)) next.set(key, {t, s});
    }
    const rows = [...next.values()].filter(a => a.s < Infinity).sort((a, b) => a.s - b.s).slice(0, 5)
      .map(({t, s}) => `<div class="row"><span class="badge" style="--b:${t.c};--bi:${ink(t.c)}">${esc(t.r)}</span><span>${esc(t.h)}</span>
        <span class="eta">${s < 60 ? 'tiba' : Math.round(s / 60) + '′'}</span></div>`).join('') || '<div class="row mute">tidak ada bus lagi hari ini</div>';
    return card('Halte TransJakarta', esc(x.name), x.d, rows);
  });

  const krlHtml = await Promise.all(stations.map(async x => {
    krlSchedule[x.id] ??= fetch('https://api.comuline.com/v1/schedule/' + x.id).then(r => r.json()).then(j => j.data).catch(() => []);
    // Same WIB-labelled-as-UTC quirk as index.html: read HH:MM straight off the string.
    const rows = (await krlSchedule[x.id])
      .map(s => ({...s, t: s.departs_at.slice(11, 16)}))
      .filter(s => +s.t.slice(0, 2) * 3600 + +s.t.slice(3) * 60 >= now)
      .sort((a, b) => a.t.localeCompare(b.t)).slice(0, 4)
      .map(s => `<div class="row"><span class="badge">${esc(s.train_id)}</span><span>${esc(s.route.replace('-', ' → '))}</span><span class="eta">${s.t}</span></div>`).join('')
      || '<div class="row mute">tidak ada kereta lagi hari ini</div>';
    return card('Stasiun KRL', `<a href="index.html?st=${encodeURIComponent(x.id)}">${esc(x.name)}</a>`, x.d, rows);
  }));

  $near.innerHTML = [...halteHtml, ...krlHtml].join('');
}

document.getElementById('locate').onclick = e => {
  e.target.disabled = true;
  $near.innerHTML = '<p class="mute">mencari lokasi…</p>';
  navigator.geolocation.watchPosition(p => {
    me = [p.coords.latitude, p.coords.longitude];
    if (!meMarker) {
      meMarker = L.circleMarker(me, {radius: 9, color: '#fff', weight: 3, fillColor: '#ffb81c', fillOpacity: 1}).bindTooltip('Kamu').addTo(map);
      map.setView(me, 15, {animate: false});
      // Bottom-sheet layout covers the lower map: nudge the dot into the visible part.
      const sheet = document.querySelector('.sheet');
      if (sheet.offsetLeft < 20 && sheet.offsetWidth > innerWidth - 40) map.panBy([0, sheet.offsetHeight / 2], {animate: false});
    }
    meMarker.setLatLng(me);
    near();
  }, err => { $near.textContent = 'Lokasi gagal: ' + err.message; e.target.disabled = false; }, {enableHighAccuracy: true});
};

const $route = document.getElementById('route'), $info = document.getElementById('info'), $near = document.getElementById('near'), $clock = document.getElementById('clock');
fetch('krl.json').then(r => r.json()).then(data => { krl = data; });
fetch('tj.json').then(r => r.json()).then(data => {
  trips = data;
  // One halte per name + ~100 m cell, so both platforms of a stop merge.
  trips.forEach(t => t.s.forEach(([lat, lon, off, name]) => {
    const key = `${name}@${lat.toFixed(3)},${lon.toFixed(3)}`;
    if (!halte.has(key)) halte.set(key, {name, ll: [lat, lon], serve: []});
    halte.get(key).serve.push([t, off]);
  }));
  setInterval(near, 30000);
  const names = new Map(trips.map(t => [t.r, t.n]));
  [...names].sort(([a], [b]) => a.localeCompare(b, 'id', {numeric: true}))
    .forEach(([r, n]) => $route.add(new Option(`${r} · ${n}`, r)));
  $route.onchange = () => { drawLines(); tick(); };
  drawLines();
  tick();
  setInterval(tick, 2000);
});
</script>
</body>
</html>
